[(#REM) Album jFlipBook ]

<BOUCLE_mot(MOTS){id_article}{titre=jflip}>
	<B_jflip>
	<div class="divers flip_gallery">
		<h4>
			<img src="#EVAL{_DIR_PLUGIN_JFLIPBOOK}img_pack/jflip.png" width="53" height="24" alt="Logo de jFlipBook" />
			Livre jFlip de [(#TOTAL_BOUCLE) image(s)]
		</h4>
		<small>Cliquez dans un des coins de l'image pour tourner les pages.</small>

		<ul
			class="jflipbook"
			data-largeur="[(#CONFIG{jflipbook/largeur,450}|intval)]"
			data-hauteur="[(#CONFIG{jflipbook/hauteur,500}|intval)]"
			data-couleur="[(#CONFIG{jflipbook/couleur,#ccc}|attribut_html)]"
			data-corners="[(#CONFIG{jflipbook/corners,0}|attribut_html)]"
			data-scale="[(#CONFIG{jflipbook/scale,fit}|attribut_html)]"
		>
			<BOUCLE_jflip(DOCUMENTS){id_article}{mode=document}{extension IN jpg,png,gif,webp}{par num titre}{doublons image}>
			<li>
				<a href="#URL_DOCUMENT"[ title="(#TITRE|supprimer_numero|attribut_html)"]>
					[(#FICHIER|image_reduire{450,0})]
				</a>
			</li>
			</BOUCLE_jflip>
		</ul>
		<div class="nettoyeur"></div>
	</div>
	</B_jflip>
</BOUCLE_mot>
<//B_mot>
